plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-${mod_framework}-${forge_version}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude(".cache/**") // datagen cache files
    exclude("**/.cache/**")
}

// Minecraft 1.20.1 ships Java 17 to end users, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

legacyForge {
    // MinecraftForge (net.minecraftforge:forge), NOT NeoForge's legacy 47.1.x branch.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Allows the crop block entity to mark the preview entity as touching water so
    // fish render correctly while displayed inside the crop.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory.set(layout.projectDirectory.dir('run'))
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory.set(layout.projectDirectory.dir('run'))
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory.set(layout.projectDirectory.dir('run'))
        }

        data {
            data()
            gameDirectory.set(layout.projectDirectory.dir('run-data'))
            programArgument '--mod'
            programArgument project.mod_id
            programArgument '--all'
            programArgument '--output'
            programArgument layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath
            programArgument '--existing'
            programArgument layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    // JEI is optional and never bundled in the mod jar. The full JEI jar already contains the
    // API classes and its own libraries, so it is used non-transitively at compile time only;
    // the published jar has no dependency on it and mods.toml does not require it.
    compileOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            issue_tracker          : issue_tracker,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
