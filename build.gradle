plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'

    // Exclude common development only resources from finalized outputs.
    exclude '**/*.bbmodel'            // BlockBench project files
    exclude '.cache'                  // datagen cache files
    exclude '**/.cache/**'            // datagen cache files
    exclude 'templates/**'            // template files (expanded via generateModMetadata)
    // Forge metadata and the Forge global loot modifier list are obsolete on NeoForge.
    // The files stay in the tree (nothing is deleted) but are never shipped.
    exclude 'META-INF/mods.toml'
    exclude 'data/forge/**'
    // NeoForge 26.3 loads every file under loot_modifiers/ as a modifier; the old
    // global_loot_modifiers.json index is no longer used and would fail to parse.
    exclude 'data/neoforge/**'
}

// JEI integration is optional (compileOnly + localRuntime, never bundled).
// GameTests are not wired into the 26.3 data-driven test framework in this branch,
// so they stay in the repository but out of the compilation; their behaviour is
// covered by the dedicated server RCON smoke test.
sourceSets.main.java {
    exclude 'com/skd/faunagarden/gametest/**'
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge-${neo_version}"
}

// Mojang ships Java 25 to end users in 26.3, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

java {
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    // Access transformers are automatically detected from META-INF/accesstransformer.cfg.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 26.3 splits data generation into client and server runs. The tags generated
        // by this mod are server data, so the "data" run is a server data run.
        data {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The 'localRuntime' configuration is used for optional dependencies that should be present
// while testing locally but must not be published as a dependency of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI is optional and never bundled in the mod jar. The full JEI jar contains the
    // API classes, so it is used non-transitively for both compiling and local dev runs.
    // 31.0.0.11 is the last 26.3 release that accepts NeoForge 26.3.0.26-beta and does not
    // require any extra mod; later 31.x releases require the mezz_config mod.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
}

// Expands the mod metadata template into META-INF/neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            issue_tracker          : issue_tracker,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/resources/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
