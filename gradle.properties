# Gradle settings
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

net.minecraftforge.gradle.merge-source-sets=true

## Environment
minecraft_version=26.2
minecraft_version_range=[26.2]
forge_version=65.1.4
# Range of the Forge dependency declared in META-INF/mods.toml.
forge_version_range=[65,)
loader_version_range=[65,)
# Alias of forge_version, used by generic tooling (e.g. the CurseForge upload script).
loader_version=65.1.4
java_version=25

## Mod metadata
mod_id=fauna_garden
mod_name=Fauna Garden
mod_license=MIT
mod_version=0.0.0
mod_group_id=com.skd.placeholder
mod_framework=forge
mod_authors=KnightMiner (original Animal Crops), Stalking Dragons
mod_description=Grows baby animals from crops, a port of Animal Crops to Minecraft 26.2.
issue_tracker=https://gitlab.com/stalking-dragons/minecraft/fauna-garden/-/issues
